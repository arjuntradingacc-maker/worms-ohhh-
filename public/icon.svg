<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4be3ff"/>
      <stop offset="55%" stop-color="#9b6bff"/>
      <stop offset="100%" stop-color="#ff5fd1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bff3ff"/>
      <stop offset="75%" stop-color="#4be3ff"/>
      <stop offset="100%" stop-color="#4be3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="128" fill="none" stroke="url(#loop)" stroke-width="34" stroke-linecap="round" stroke-dasharray="700 100"/>
    <circle cx="256" cy="120" r="46" fill="url(#core)"/>
    <circle cx="256" cy="120" r="17" fill="#ffffff"/>
    <circle cx="368" cy="300" r="8" fill="#ff9fe8"/>
    <circle cx="150" cy="320" r="6" fill="#8fe9ff"/>
  </g>
</svg>
